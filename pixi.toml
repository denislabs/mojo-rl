[workspace]
authors = ["Denis Laboureyras"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
preview = ["pixi-build"]
name = "mojo-rl"
platforms = [
    { platform = "linux-64", cuda = "12" },
    { platform = "osx-arm64", macos = "15.0" },
]
version = "0.1.0"
license = "MIT"
license-file = "LICENSE"
homepage = "https://github.com/denislabs/mojo-rl"
repository = "https://github.com/denislabs/mojo-rl"


[feature.nvidia]
channels = ["nvidia"]

[feature.nvidia.target.linux-64.dependencies]
# Pin to 3.13 so the nvidia solve matches apple (osx-arm64 resolves 3.13) AND the
# `libpython3.13.so` activation string below — else Mojo's Python interop aborts
# on the first import (e.g. RemoteLogger.flush → urllib). Box-independent.
python = ">=3.13.14,<3.14"
cuda-toolkit = ">=12.9.2,<13" # for compute-sanitizer etc.
cuda-gdb = ">=12.9.79,<13"     # for GPU kernel debugging
nsight-compute = ">=2025.2.1.3,<2026"  # interactive kernel profiling
cudnn = ">=9.14.0.64,<10"     # cuDNN for conv_gpu/conv_cudnn

[feature.nvidia.activation]
# Use the system ptxas from the CUDA container (/usr/local/cuda/bin/ptxas).
# This bypasses MAX's built-in libnvptxcompiler (tied to CUDA 13 + driver >= 580)
# and works with any CUDA container (12.x or 13.x) on driver >= 570.
# On CUDA 13 containers (RTX 5090): ptxas 13.x → supports sm_120 (Blackwell) ✅
# On CUDA 12.8 containers (RTX 4090): ptxas 12.x → supports sm_89 (Ada) ✅
env = { MODULAR_NVPTX_COMPILER_PATH = "/usr/local/cuda/bin/ptxas", LD_PRELOAD = "$PIXI_PROJECT_ROOT/mojo_rl/cuda/libcuda_intercept.so" }
scripts = ["scripts/build_cuda_intercept.sh"]

[feature.amd]

[feature.apple]

[feature.act-ref.dependencies]
# PyTorch, for GATING ONLY. `tools/act/dump_act_reference.py` runs the ACT
# reference (`references/act-main/`) on seeded weights and dumps every
# intermediate activation + parameter to .npy, which the Mojo ACT gates then
# compare against. Nothing under `mojo_rl/` imports torch, and no training or
# inference path depends on this environment — without it the ACT port could
# only be checked against itself, which is not a check.
#   pixi run -e act-ref python tools/act/dump_act_reference.py --out /tmp/act_ref
pytorch = ">=2.5,<3"
torchvision = ">=0.20,<1"
numpy = ">=1.26"

[feature.cpu.dependencies]
# CPU-only environment for CI and headless test runs: base deps WITHOUT the
# CUDA toolchain the `default`/`nvidia` envs pull on linux-64 (GBs of
# cuda-toolkit/cudnn a GitHub runner neither needs nor caches well).
# Python pinned to 3.13 to match the MOJO_PYTHON_LIBRARY activation string.
python = ">=3.13.14,<3.14"

[dependencies]
mojo = "==1.0.0"
max = "==26.5.0"
gymnasium = ">=1.3.0,<2"
# ⚠ DECLARED, NOT TRANSITIVE. `mojo_rl/physics3d/collision/native/mrl_qhull.c`
# links libqhull_r to reproduce `mjCMesh::MakeGraph`'s facet ORDER, which is
# what decides every merged polygon's normal (see `collision/qhull_native.mojo`).
# qhull was already present as a transitive dep of another package; relying on
# that would break the mesh pipeline the day that package moved.
qhull = ">=2020.2,<2021"
# Atari ROM support. ale-py ships without ROMs; `pixi run setup-roms` downloads
# the canonical Farama ROM bundle (see scripts/setup_roms.py) and symlinks them.
ale-py = ">=0.12.0,<0.13"           # Arcade Learning Environment (requires ROMs)
pygame = ">=2.6.1,<3"
python = ">=3.12.13,<3.14"
swig = ">=4.4.1,<5"
box2d-py = ">=2.3.8,<3"  # for gymnasium Box2D envs (LunarLander, BipedalWalker, CarRacing)
mujoco = ">=3.10.0,<4"    # for gymnasium MuJoCo envs (HalfCheetah, Ant, Humanoid, etc.)
imageio = ">=2.37.0,<3"
imageio-ffmpeg = ">=0.6.0,<0.7"
shaderc = ">=2026.2,<2027"  # for GLSL->SPIR-V shader compilation (cross-platform rendering)
hdf5 = ">=2.1.0,<3"             # libhdf5 C library, FFI target for mojo_rl/io/hdf5
hdf5plugin = ">=7.0.0,<8"          # Blosc/LZ4/ZSTD chunk-compression filters loaded via HDF5_PLUGIN_PATH
h5py = ">=3.16.0,<4"             # used by inspection script + parity test (not by the Mojo loader)
huggingface_hub = ">=1.24.0,<2"  # first-run dataset download
pyarrow = ">=24.0.0,<25"            # read HF parquet datasets (e.g. CIFAR-10 loader)
zstandard = ">=0.25.0,<0.26"        # first-run decompression of .h5.zst envelope

[package]
name = "mojo_rl"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.1.*" }

[package.host-dependencies]
mojo-compiler = "==1.0.0"

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = "==1.0.0"

# Point Mojo's embedded Python at the *active* env (CONDA_PREFIX), not a hardcoded
# `default` env — otherwise `pixi run -e nvidia/apple` loads the wrong libpython and
# `Python.import_module("max")` fails with "No module named 'max'" when `default`
# isn't installed. Each env carries its own libpython + max.
[target.osx-arm64.activation]
env = { MOJO_PYTHON_LIBRARY = "$CONDA_PREFIX/lib/libpython3.13.dylib" }

[target.linux-64.activation]
env = { MOJO_PYTHON_LIBRARY = "$CONDA_PREFIX/lib/libpython3.13.so" }

[environments]
nvidia = { features = ["nvidia"], solve-group = "nvidia" }
amd = { features = ["amd"], solve-group = "amd" }
apple = { features = ["apple"], solve-group = "apple" }
cpu = { features = ["cpu"], solve-group = "cpu" }
# Reference-gate environment only — see [feature.act-ref.dependencies].
act-ref = { features = ["act-ref"], solve-group = "act-ref" }
default = { features = ["nvidia"] }

[tasks]
install-pre-commit = "pre-commit install"
setup-roms = { cmd = "python3 scripts/setup_roms.py", description = "Download Atari 2600 ROMs and symlink roms/ for the emulator" }
build = { cmd = "mojo precompile mojo_rl -o mojo_rl.mojoc" }
run = { cmd = "mojo run -I ." }
test = { cmd = "mojo run -I ." }
# Tiered test suites (scripts/run_tests.sh — see its header for details):
#   test-smoke  curated fast CPU gates (tests/manifests/smoke.txt) — the CI
#               tier; self-contained (no references/, no ROMs, no GPU).
#   test-cpu    discover ALL non-GPU tests under tests/ (hours; run before
#               big merges or via the weekly CI cron).
#   test-gpu    discover *_gpu.mojo tests; run as
#               `pixi run -e apple test-gpu` or `pixi run -e nvidia test-gpu`.
test-smoke = { cmd = "bash scripts/run_tests.sh tests/manifests/smoke.txt", description = "Fast curated CPU test tier (CI)" }
examples-compile = { cmd = "bash scripts/run_tests.sh --compile-only tests/manifests/examples-compile.txt", description = "Compile-probe the root examples (CI)" }
test-cpu = { cmd = "bash scripts/run_tests.sh --discover tests --cpu-only", description = "All non-GPU tests (slow)" }
# ACT gates. Needs the torch reference dump + the converted LeRobot store —
# see tests/manifests/act.txt for the two prerequisite commands.
test-act = { cmd = "bash scripts/run_tests.sh tests/manifests/act.txt", description = "ACT reference gates (needs -e act-ref dumps)" }
test-act-gpu = { cmd = "bash scripts/run_tests.sh tests/manifests/act-gpu.txt", description = "ACT GPU-vs-CPU gates (use -e apple|nvidia)" }
test-gpu = { cmd = "bash scripts/run_tests.sh --discover tests --gpu-only", description = "All *_gpu.mojo tests (use -e apple|nvidia)" }
# Model dimensions are GENERATED from the .xml assets via MuJoCo. Editing a
# VALUE in an asset needs no regeneration; adding or removing an element does,
# because only that changes a count. Drift is silent — a stale count sizes a
# slab wrong and the model still builds — so CI checks it on every push.
gen-dims = { cmd = "python tools/gen_model_dims.py", description = "Regenerate mojo_rl/envs/**/*_dims.mojo from the .xml assets" }
gen-dims-check = { cmd = "python tools/gen_model_dims.py --check", description = "Fail if any generated *_dims.mojo is stale (CI)" }
format = { cmd = "mojo format -l 80 ." }
# Dear ImGui shim for `mojo_rl/render/imgui/` (the ImGui dm_control viewer).
# Clones ImGui into third_party/ on first run, then rebuilds only when stale.
# Neither the clone nor the built dylib is tracked, so this is a prerequisite
# of examples/dm_control/dm_viewer_imgui.mojo on a fresh checkout.
build-imgui = { cmd = "bash scripts/build_imgui.sh", description = "Build the Dear ImGui shim (mojo_rl/render/imgui/)" }
# Serial shim for `mojo_rl/io/serial/` (the SO-101 Feetech bus). Six lines of
# C for ONE call Mojo's FFI cannot make: `ioctl` is C-variadic, and on Apple
# arm64 variadic args go on the stack while `external_call` puts them in
# registers -> silent EFAULT. Prerequisite of anything under `mojo_rl/robot/`.
build-serial = { cmd = "bash scripts/build_serial.sh", description = "Build the serial shim (mojo_rl/io/serial/)" }
# qhull shim for `mojo_rl/physics3d/collision/`. MuJoCo does not implement a
# convex hull — `MakeGraph` CALLS qhull and walks `FORALLfacets`, and that
# order decides every polygon normal. Prerequisite of any MESH model.
build-qhull = { cmd = "bash scripts/build_qhull.sh", description = "Build the qhull shim (mojo_rl/physics3d/collision/)" }
# The SO-101 hardware gate: dump both arms from Mojo, diff against
# `tools/soarm/so101_diag.py` (Python + lerobot). Read-only — writes no
# register and never touches torque. Needs the arms plugged in.
soarm-diag = { cmd = "mojo run -I . tools/soarm/so101_mojo_diag.mojo", depends-on = ["build-serial"], description = "Dump both SO-101 arms (read-only hardware gate)" }
# Recovery: release torque on both arms after a control loop died without
# running its cleanup (a kill, a crash). A follower left holding a pose
# resists being moved and heats up.
soarm-torque-off = { cmd = "mojo run -I . tools/soarm/so101_torque_off.mojo", depends-on = ["build-serial"], description = "Release torque on both SO-101 arms" }
# NVIDIA GPU information and profiling utilities
gpu-info = { cmd = "nvidia-smi --query-gpu=name,compute_cap,memory.total,driver_version --format=csv", description = "Get basic GPU information" }

# GPU specs
gpu-specs = { cmd = "python3 scripts/gpu_specs.py", description = "Get complete GPU architectural specifications (NVIDIA/AMD/Apple Silicon)" }

# Shader compilation
compile-shaders = { cmd = "bash mojo_rl/render/shaders/compile.sh", description = "Compile GLSL shaders to SPIR-V bytecode" }

# macOS
check-macos = { cmd = "sw_vers -productVersion | awk -F. '{if($1<15) {print \"Error: macOS 15+ required, found \" $0; exit 1}}'", description = "Ensure macOS 15+" }
